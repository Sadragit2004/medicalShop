<section class="mx-4 lg:container mt-10 lg:mt-20">
    <!-- SECTION TITLE -->
    <div class="flex flex-col gap-y-4 xs:flex-row items-center justify-between w-full text-center xs:text-start">
        <div class="flex items-center gap-x-2 sm:gap-x-4">
            <span class="size-12 hidden xs:flex rounded-lg bg-white shadow-lg dark:bg-gray-800 flex-center">
                <svg class="size-7 text-gray-700 dark:text-gray-100">
                    <use href="#check-badge"></use>
                </svg>
            </span>

            <div class="space-y-1 md:space-y-1">
                <span class="text-xl md:text-2xl font-MorabbaMedium text-gray-800 dark:text-gray-50">
                    محبوب‌ترین
                    <span class="text-blue-600 dark:text-blue-500">مقالات</span>
                </span>
                <p class="text-sm text-gray-500 dark:text-gray-300">جدیدترین و بروزترین مقالات</p>
            </div>
        </div>

        <div class="w-full xs:w-auto flex justify-between xs:justify-end items-center gap-x-2">
            <div class="flex items-center gap-x-2">
                <button type="button" class="slider-navigate_btn articleSlider-prev-slide" aria-label="مقاله قبلی">
                    <svg class="size-6 -rotate-90">
                        <use href="#chevron"></use>
                    </svg>
                </button>

                <button type="button" class="slider-navigate_btn articleSlider-next-slide" aria-label="مقاله بعدی">
                    <svg class="size-6 rotate-90">
                        <use href="#chevron"></use>
                    </svg>
                </button>
            </div>

            <a href="{% url 'blog:blog_list' %}"
               class="group shadow-xl text-sm md:text-base flex gap-x-1.5 items-center px-2 h-10 md:px-3 text-white bg-blue-600 rounded-xl">
                <p>مشاهده همه</p>
                <span class="w-7 h-7 rounded-full bg-blue-500 flex-center md:group-hover:-translate-x-1 transition-transform duration-300">
                    <svg class="size-5">
                        <use href="#arrow"></use>
                    </svg>
                </span>
            </a>
        </div>
    </div>

    <div class="swiper articleSlider w-full mt-5">
        <div class="swiper-wrapper w-full py-5">
            {% for blog in latest_blogs %}
                <!-- ARTICLE ITEM -->
                <div class="swiper-slide group article-box flex flex-col h-full">

                    <!-- IMAGE -->
                    <a href="{% url 'blog:blog_detail' blog.slug %}"
                       class="relative block w-full h-48 min-h-[12rem] max-h-[12rem] shrink-0 overflow-hidden rounded-lg bg-gray-50 dark:bg-gray-800"
                       aria-label="{{ blog.title }}">

                        {% if blog.mainImage %}
                            <img
                                loading="lazy"
                                decoding="async"
                                src="{{ blog.mainImage.url }}"
                                class="block w-full h-full object-contain object-center"
                                alt="{{ blog.title }}"
                            />
                        {% else %}
                            <img
                                loading="lazy"
                                decoding="async"
                                src="{{ media_url }}/images/default-article.jpg"
                                class="block w-full h-full object-contain object-center"
                                alt="{{ blog.title }}"
                            />
                        {% endif %}
                    </a>

                    <!-- TITLE -->
                    <div class="flex flex-col gap-y-1 py-5 px-1">
                        <a href="{% url 'blog:blog_detail' blog.slug %}"
                           class="font-DanaDemiBold hover:text-blue-600 dark:hover:text-sky-400 transition-colors duration-300">
                            {{ blog.title }}
                        </a>
                    </div>

                    <span class="flex w-full h-1 py-1 border-t border-gray-100 dark:border-white/10"></span>

                    <!-- META -->
                    <div class="flex items-center justify-between text-sm px-1">
                        <span class="flex items-center gap-x-1 text-blue-500 dark:text-sky-400">
                            <svg class="w-4 h-4">
                                <use href="#calendar"></use>
                            </svg>
                            <p class="mt-1">{{ blog.publishedAt|date:"Y/m/d" }}</p>
                        </span>

                        <span class="flex items-start gap-x-1 text-gray-300">
                            <p class="font-DanaDemiBold">{{ blog.view_count }}</p>
                            <svg class="w-4 h-4">
                                <use href="#eye"></use>
                            </svg>
                        </span>
                    </div>
                </div>
            {% empty %}
                <!-- EMPTY STATE -->
                <div class="swiper-slide">
                    <div class="col-span-full text-center py-10">
                        <p class="text-gray-500">هیچ مقاله‌ای یافت نشد.</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
