<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>مدیریت قیمت | مرجع قیمت ایران</title>

    <link rel="preconnect" href="https://lib.arvancloud.ir" crossorigin>
    <link rel="stylesheet" href="https://lib.arvancloud.ir/font-awesome/6.3.0/css/all.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --primary-hover: #4338ca;

            --success: #059669;
            --success-soft: #ecfdf5;

            --danger: #dc2626;
            --danger-soft: #fef2f2;

            --warning: #d97706;
            --warning-soft: #fffbeb;

            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-soft: #f8fafc;

            --text: #172033;
            --text-secondary: #475569;
            --text-muted: #94a3b8;

            --border: #e7eaf0;
            --border-strong: #d9dee8;

            --shadow-xs: 0 1px 2px rgba(15, 23, 42, .03);
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, .045);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, .07);
            --shadow-lg: 0 20px 50px rgba(15, 23, 42, .14);

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;

            --ease: cubic-bezier(.2, .8, .2, 1);
        }

        html {
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            padding: 18px;
            background: var(--bg);
            color: var(--text);
            font-family:
                Vazirmatn,
                IRANSans,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: rgba(79, 70, 229, .15);
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd2dc;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aeb7c5;
        }

        .app {
            width: min(1800px, 100%);
            margin: 0 auto;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 86px;
            padding: 18px 20px;
            margin-bottom: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: var(--primary);
            color: #fff;
            font-size: 17px;
            box-shadow: 0 8px 18px rgba(79, 70, 229, .2);
        }

        .brand-copy h1 {
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 800;
            letter-spacing: -.2px;
        }

        .brand-copy p {
            margin-top: 2px;
            color: var(--text-muted);
            font-size: .7rem;
        }

        .stats {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 7px;
        }

        .stat-card {
            min-width: 108px;
            height: 44px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-soft);
            color: var(--text-secondary);
            font-size: .7rem;
            white-space: nowrap;
        }

        .stat-card i {
            color: var(--primary);
            font-size: .75rem;
        }

        .stat-card strong,
        .stat-card span {
            color: var(--text);
            font-weight: 800;
        }

        /* =========================================================
           TOOLBAR
           ========================================================= */

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px;
            margin-bottom: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
        }

        .search-wrapper {
            flex: 1;
            min-width: 220px;
        }

        .search-box {
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: var(--surface-soft);
            transition:
                border-color .18s var(--ease),
                background .18s var(--ease),
                box-shadow .18s var(--ease);
        }

        .search-box:focus-within {
            background: #fff;
            border-color: rgba(79, 70, 229, .35);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, .07);
        }

        .search-box > i {
            color: var(--text-muted);
            font-size: .78rem;
        }

        .search-box:focus-within > i {
            color: var(--primary);
        }

        .search-box input {
            width: 100%;
            min-width: 0;
            padding: 0 10px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: .78rem;
        }

        .search-box input::placeholder {
            color: #a3acb9;
        }

        .search-clear {
            width: 28px;
            height: 28px;
            display: none;
            place-items: center;
            flex: 0 0 28px;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
        }

        .search-clear:hover {
            color: var(--danger);
        }

        .search-results-count {
            min-height: 15px;
            padding: 4px 12px 0;
            color: var(--text-muted);
            font-size: .64rem;
        }

        .toolbar-actions {
            display: flex;
            gap: 7px;
        }

        .btn {
            height: 42px;
            padding: 0 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid transparent;
            border-radius: 11px;
            cursor: pointer;
            font-size: .72rem;
            font-weight: 700;
            white-space: nowrap;
            transition:
                transform .15s var(--ease),
                background .15s var(--ease),
                border-color .15s var(--ease),
                box-shadow .15s var(--ease);
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn-primary {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 5px 14px rgba(79, 70, 229, .18);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            color: var(--text-secondary);
            background: var(--surface);
            border-color: var(--border);
        }

        .btn-outline:hover {
            border-color: var(--border-strong);
            background: var(--surface-soft);
        }

        /* =========================================================
           CATEGORY
           ========================================================= */

        .category-filter {
            display: flex;
            gap: 6px;
            padding: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        .category-filter::-webkit-scrollbar {
            display: none;
        }

        .category-filter button {
            height: 34px;
            flex: 0 0 auto;
            padding: 0 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: .69rem;
            font-weight: 700;
            white-space: nowrap;
            transition:
                background .16s var(--ease),
                color .16s var(--ease),
                border-color .16s var(--ease);
        }

        .category-filter button i {
            font-size: .65rem;
            color: var(--text-muted);
        }

        .category-filter button:hover {
            background: var(--surface-soft);
        }

        .category-filter button.active {
            background: var(--primary-soft);
            border-color: rgba(79, 70, 229, .1);
            color: var(--primary);
        }

        .category-filter button.active i {
            color: var(--primary);
        }

        /* =========================================================
           TABLE
           ========================================================= */

        .table-container {
            position: relative;
            overflow: auto;
            max-height: calc(100vh - 225px);
            min-height: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .product-table {
            width: 100%;
            min-width: 1080px;
            border-collapse: separate;
            border-spacing: 0;
        }

        .product-table th {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 45px;
            padding: 0 12px;
            background: #fbfcfd;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            text-align: right;
            font-size: .65rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .product-table td {
            height: 61px;
            padding: 7px 12px;
            border-bottom: 1px solid #f0f2f5;
            color: var(--text-secondary);
            font-size: .72rem;
            vertical-align: middle;
        }

        .product-table tbody tr {
            transition: background .12s ease;
        }

        .product-table tbody tr:hover {
            background: #fafbff;
        }

        .product-table tbody tr.disabled-row {
            background: #fbfbfc;
        }

        .product-table tbody tr.disabled-row:hover {
            background: #f8f9fb;
        }

        .product-title-cell {
            max-width: 310px;
            color: var(--text);
            font-weight: 700;
            line-height: 1.7;
        }

        /* =========================================================
           PRICE / STOCK INPUT
           ========================================================= */

        .price-input,
        .stock-input {
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: 0;
            background: var(--surface-soft);
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: .72rem;
            font-weight: 700;
            transition:
                border-color .16s ease,
                background .16s ease,
                box-shadow .16s ease;
        }

        .price-input {
            width: 118px;
            padding: 0 10px;
            text-align: left;
        }

        .stock-input {
            width: 76px;
            padding: 0 8px;
            text-align: center;
        }

        .price-input:hover,
        .stock-input:hover {
            border-color: #cbd2dc;
        }

        .price-input:focus,
        .stock-input:focus {
            background: #fff;
            border-color: rgba(79, 70, 229, .5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, .07);
        }

        /* =========================================================
           TOGGLE
           ========================================================= */

        .toggle-btn,
        .mobile-toggle-btn {
            position: relative;
            width: 42px;
            height: 23px;
            padding: 0;
            border: 0;
            border-radius: 20px;
            background: #d7dce4;
            cursor: pointer;
            vertical-align: middle;
            transition: background .18s ease;
        }

        .toggle-btn::after,
        .mobile-toggle-btn::after {
            content: "";
            position: absolute;
            top: 3px;
            right: 3px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .2);
            transition: right .18s var(--ease);
        }

        .toggle-btn.active,
        .mobile-toggle-btn.active {
            background: var(--success);
        }

        .toggle-btn.active::after,
        .mobile-toggle-btn.active::after {
            right: 22px;
        }

        /* =========================================================
           BADGES
           ========================================================= */

        .status-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #cbd2dc;
        }

        .status-dot.on {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, .09);
        }

        .status-dot.off {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, .08);
        }

        .status-text {
            color: var(--text-muted);
            font-size: .65rem;
            font-weight: 700;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 7px;
            font-size: .62rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .type-physical {
            background: #ecfdf5;
            color: #047857;
        }

        .type-download {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .type-package {
            background: #fffbeb;
            color: #b45309;
        }

        .price-main {
            color: var(--text);
            font-weight: 800;
            font-size: .74rem;
        }

        .price-discount {
            color: var(--success);
            font-weight: 800;
        }

        .price-original {
            margin-right: 5px;
            color: var(--text-muted);
            text-decoration: line-through;
            font-size: .61rem;
        }

        .discount-badge {
            margin-right: 5px;
            padding: 3px 6px;
            border-radius: 6px;
            background: var(--warning-soft);
            color: var(--warning);
            font-size: .59rem;
            font-weight: 800;
        }

        .change-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 7px;
            border-radius: 7px;
            font-size: .61rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .change-up {
            background: var(--success-soft);
            color: var(--success);
        }

        .change-down {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .change-same {
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 7px;
            border-radius: 7px;
            background: #f1f5f9;
            color: var(--text-secondary);
            font-size: .62rem;
            font-weight: 700;
        }

        .stock-badge.zero {
            background: var(--danger-soft);
            color: var(--danger);
        }

        /* =========================================================
           DISCOUNT
           ========================================================= */

        .btn-discount {
            height: 33px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #f1dfae;
            border-radius: 9px;
            background: var(--warning-soft);
            color: var(--warning);
            cursor: pointer;
            font-size: .62rem;
            font-weight: 800;
            white-space: nowrap;
            transition: all .16s ease;
        }

        .btn-discount:hover {
            border-color: #eacb7e;
            background: #fff7df;
        }

        .btn-discount.has-discount {
            border-color: rgba(5, 150, 105, .12);
            background: var(--success-soft);
            color: var(--success);
        }

        /* =========================================================
           SPARKLINE
           ========================================================= */

        .sparkline-canvas {
            width: 90px;
            height: 34px;
            display: block;
        }

        /* =========================================================
           LOAD MORE
           ========================================================= */

        .load-more-btn {
            width: 100%;
            height: 38px;
            border: 1px dashed #cfd6e1;
            border-radius: 9px;
            background: #fafbfc;
            color: var(--primary);
            cursor: pointer;
            font-size: .68rem;
            font-weight: 800;
        }

        .load-more-btn:hover {
            background: var(--primary-soft);
            border-color: rgba(79, 70, 229, .25);
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        .mobile-view {
            display: none;
        }

        .mobile-cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-card {
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
        }

        .product-card.disabled-card {
            background: #fbfbfc;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 11px;
            border-bottom: 1px solid #f0f2f5;
        }

        .product-info-header {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-img {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 11px;
            background: #f3f5f8;
            color: var(--text-muted);
            font-size: 18px;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-title {
            margin-bottom: 5px;
            color: var(--text);
            font-size: .76rem;
            font-weight: 800;
            line-height: 1.7;
        }

        .mobile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            margin-top: 10px;
        }

        .mobile-info {
            min-height: 55px;
            padding: 9px;
            border-radius: 10px;
            background: var(--surface-soft);
        }

        .mobile-info-label {
            margin-bottom: 4px;
            color: var(--text-muted);
            font-size: .58rem;
            font-weight: 700;
        }

        .mobile-info-value {
            color: var(--text);
            font-size: .7rem;
            font-weight: 800;
        }

        .mobile-price {
            font-size: .73rem;
        }

        .mobile-actions {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 7px;
            margin-top: 9px;
        }

        .mobile-action {
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: .66rem;
            font-weight: 800;
        }

        .mobile-action.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .mobile-action.discount {
            background: var(--warning-soft);
            border-color: #f1dfae;
            color: var(--warning);
        }

        .mobile-stock {
            margin-top: 9px;
        }

        .mobile-stock-input {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: 0;
            background: var(--surface-soft);
            text-align: center;
            color: var(--text);
            font-size: .72rem;
            font-weight: 800;
        }

        /* =========================================================
           HISTORY
           ========================================================= */

        .history-panel {
            margin-top: 10px;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
            color: var(--text);
            font-size: .72rem;
            font-weight: 800;
        }

        .history-title i {
            color: var(--primary);
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }

        .history-item {
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid #edf0f4;
            border-radius: 10px;
            background: #fafbfc;
            font-size: .64rem;
            line-height: 1.7;
        }

        .history-item strong {
            color: var(--text);
            font-weight: 800;
        }

        .history-date {
            color: var(--text-muted);
            font-size: .57rem;
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .full-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .38);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .full-modal.active {
            display: flex;
        }

        .full-modal-content {
            width: min(430px, 100%);
            max-height: min(680px, 90vh);
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            animation: modalIn .2s var(--ease);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 17px;
            border-bottom: 1px solid var(--border);
            background: #fbfcfd;
        }

        .modal-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-header-top h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: .82rem;
            font-weight: 800;
        }

        .modal-header-top h3 i {
            color: var(--warning);
        }

        .close-modal-btn {
            width: 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #fff;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-modal-btn:hover {
            color: var(--danger);
        }

        .modal-product-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 13px;
        }

        .modal-product-img {
            width: 38px;
            height: 38px;

<script>
"use strict";

/* =========================================================
   STATE
   ========================================================= */

let products = [];
let priceHistory = [];

let currentView = "pc";
let currentSearchTerm = "";
let currentCategory = "all";
let currentDiscountProduct = null;

let productsRequestController = null;
let productsRequestSequence = 0;

const saleTypeIdMap = new Map();
const sparklineCache = new Map();
const sparklineInFlight = new Map();

const pageState = {
    size: 50
};

let toastTimer = null;

/* =========================================================
   HELPERS
   ========================================================= */

function formatNumber(value) {
    if (value === null || value === undefined || value === "") {
        return "0";
    }

    return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function parseNumber(value) {
    const normalized = String(value ?? "")
        .replace(/[,\s]/g, "")
        .replace(/[^0-9]/g, "");

    const number = Number.parseInt(normalized, 10);

    return Number.isFinite(number) ? number : 0;
}

function calculatePercent(oldPrice, newPrice) {
    oldPrice = Number(oldPrice) || 0;
    newPrice = Number(newPrice) || 0;

    if (!oldPrice) {
        return 0;
    }

    return Number((((newPrice - oldPrice) / oldPrice) * 100).toFixed(1));
}

function debounce(fn, delay) {
    let timer = null;

    return function (...args) {
        clearTimeout(timer);

        timer = setTimeout(() => {
            fn.apply(this, args);
        }, delay);
    };
}

function throttle(fn, delay) {
    let last = 0;
    let timer = null;

    return function (...args) {
        const now = Date.now();
        const remaining = delay - (now - last);

        if (remaining <= 0) {
            last = now;
            fn.apply(this, args);
            return;
        }

        if (!timer) {
            timer = setTimeout(() => {
                last = Date.now();
                timer = null;
                fn.apply(this, args);
            }, remaining);
        }
    };
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));
}

function highlightText(text, search) {
    const safeText = escapeHtml(text);

    if (!search) {
        return safeText;
    }

    const escapedSearch = search.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    if (!escapedSearch) {
        return safeText;
    }

    const regex = new RegExp(`(${escapedSearch})`, "gi");

    return safeText.replace(
        regex,
        '<mark style="background:#fef3c7;color:inherit;border-radius:4px;padding:0 2px;">$1</mark>'
    );
}

function getFilteredProducts() {
    let result = products;

    if (currentCategory !== "all") {
        const categoryId = Number.parseInt(currentCategory, 10);

        result = result.filter(product =>
            Array.isArray(product.categoryIds) &&
            product.categoryIds.includes(categoryId)
        );
    }

    const search = currentSearchTerm.trim().toLowerCase();

    if (search) {
        result = result.filter(product =>
            String(product.title || "").toLowerCase().includes(search)
        );
    }

    return result;
}

function showMessage(message, isError = false) {
    const toast = document.getElementById("toastMessage");

    toast.textContent = message;

    toast.style.background = isError
        ? "#dc2626"
        : "#172033";

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2400);
}

function setTableLoading(status) {
    const loader = document.getElementById("tableLoading");

    if (!loader) {
        return;
    }

    loader.classList.toggle("active", status);
}

/* =========================================================
   SPARKLINE
   ========================================================= */

function drawSparklineOnCanvas(canvas, prices) {
    if (!canvas) {
        return;
    }

    const ctx = canvas.getContext("2d");

    if (!ctx) {
        return;
    }

    const dpr = window.devicePixelRatio || 1;
    const width = canvas.clientWidth || 90;
    const height = canvas.clientHeight || 34;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    if (!prices || prices.length < 2) {
        ctx.strokeStyle = "#d7dce4";
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);

        ctx.beginPath();
        ctx.moveTo(0, height / 2);
        ctx.lineTo(width, height / 2);
        ctx.stroke();

        ctx.setLineDash([]);

        return;
    }

    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const range = maxPrice - minPrice;

    const isUp = prices[prices.length - 1] >= prices[0];

    const lineColor = isUp
        ? "#059669"
        : "#dc2626";

    const points = prices.map((price, index) => {
        const x = (index / (prices.length - 1)) * width;

        const y = range > 0
            ? height - ((price - minPrice) / range) * (height - 8) - 4
            : height / 2;

        return { x, y };
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, height);

    gradient.addColorStop(
        0,
        isUp
            ? "rgba(5,150,105,.12)"
            : "rgba(220,38,38,.12)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.beginPath();
    ctx.moveTo(points[0].x, height);

    points.forEach(point => {
        ctx.lineTo(point.x, point.y);
    });

    ctx.lineTo(points[points.length - 1].x, height);
    ctx.closePath();

    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();

    points.forEach((point, index) => {
        if (index === 0) {
            ctx.moveTo(point.x, point.y);
        } else {
            ctx.lineTo(point.x, point.y);
        }
    });

    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.7;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    const last = points[points.length - 1];

    ctx.fillStyle = lineColor;
    ctx.beginPath();
    ctx.arc(last.x - 2, last.y, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(last.x - 2, last.y, 1.2, 0, Math.PI * 2);
    ctx.fill();
}

async function fetchSparkline(productId) {
    if (sparklineCache.has(productId)) {
        return sparklineCache.get(productId);
    }

    if (sparklineInFlight.has(productId)) {
        return sparklineInFlight.get(productId);
    }

    const promise = fetch(
        `/price/api/product/${productId}/price-history/?limit=12`,
        {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store"
        }
    )
        .then(response => {
            if (!response.ok) {
                throw new Error("Sparkline request failed");
            }

            return response.json();
        })
        .then(data => {
            const prices = Array.isArray(data.history)
                ? data.history
                    .map(item => Number(item.price_new) || 0)
                    .reverse()
                : [];

            sparklineCache.set(productId, prices);

            return prices;
        })
        .catch(() => {
            sparklineCache.set(productId, []);
            return [];
        })
        .finally(() => {
            sparklineInFlight.delete(productId);
        });

    sparklineInFlight.set(productId, promise);

    return promise;
}

function drawSparklineForCanvas(canvas, productId) {
    if (!canvas) {
        return;
    }

    if (sparklineCache.has(productId)) {
        drawSparklineOnCanvas(
            canvas,
            sparklineCache.get(productId)
        );

        return;
    }

    drawSparklineOnCanvas(canvas, []);

    fetchSparkline(productId).then(prices => {
        const currentCanvas = document.querySelector(
            `.sparkline-canvas[data-id="${productId}"]`
        );

        if (currentCanvas) {
            drawSparklineOnCanvas(
                currentCanvas,
                prices
            );
        }
    });
}

function drawSparklinesVisible(productIds) {
    if (!productIds.length) {
        return;
    }

    const run = () => {
        productIds.forEach(productId => {
            const canvas = document.querySelector(
                `.sparkline-canvas[data-id="${productId}"]`
            );

            if (canvas) {
                drawSparklineForCanvas(
                    canvas,
                    productId
                );
            }
        });
    };

    if ("requestIdleCallback" in window) {
        window.requestIdleCallback(run, { timeout: 500 });
    } else {
        setTimeout(run, 80);
    }
}

/* =========================================================
   API - STATS
   ========================================================= */

const loadStats = throttle(async function () {
    try {
        const response = await fetch(
            "/price/api/dashboard-stats/",
            {
                credentials: "same-origin",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            return;
        }

        const data = await response.json();

        if (!data.success) {
            return;
        }

        const stats = data.stats || {};

        document.getElementById("totalProducts").textContent =
            stats.total_products ?? 0;

        document.getElementById("activeCount").textContent =
            Math.max(
                0,
                (stats.total_products || 0) -
                (stats.out_of_stock || 0)
            );

        document.getElementById("todayChanges").textContent =
            stats.today_changes ?? 0;

        const average = Number(stats.avg_change_today || 0);

        document.getElementById("avgIncrease").textContent =
            average > 0
                ? `+${average}%`
                : `${average}%`;

        if (Array.isArray(data.latest_changes)) {
            priceHistory = data.latest_changes.map(change => ({
                productTitle: change.product_title,
                oldPrice: change.old_price,
                newPrice: change.new_price,
                percent: Number(change.percent_change || 0),
                date: change.created_at
            }));

            renderHistory();
        }

    } catch (error) {
        console.error(error);
    }
}, 1200);

/* =========================================================
   API - CATEGORIES
   ========================================================= */

async function loadCategories() {
    try {
        const response = await fetch(
            "/price/api/categories/",
            {
                credentials: "same-origin",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Categories request failed");
        }

        const data = await response.json();

        if (!data.success) {
            return;
        }

        const container =
            document.getElementById("categoryFilter");

        const fragment =
            document.createDocumentFragment();

        const allButton =
            document.createElement("button");

        allButton.type = "button";
        allButton.className =
            "category-btn active";
        allButton.dataset.category = "all";

        allButton.innerHTML =
            '<i class="fas fa-layer-group"></i> همه';

        allButton.addEventListener(
            "click",
            () => selectCategory("all", allButton)
        );

        fragment.appendChild(allButton);

        for (const category of data.categories || []) {
            const button =
                document.createElement("button");

            button.type = "button";
            button.className = "category-btn";
            button.dataset.category = category.id;

            const parentTitle =
                category.parent?.title
                    ? ` (${escapeHtml(category.parent.title)})`
                    : "";

            button.innerHTML =
                `<i class="fas fa-tag"></i>
                 ${escapeHtml(category.title)}
                 ${parentTitle}`;

            button.addEventListener(
                "click",
                () => selectCategory(
                    category.id,
                    button
                )
            );

            fragment.appendChild(button);
        }

        container.replaceChildren(fragment);

    } catch (error) {
        console.error(error);
    }
}

function selectCategory(categoryId, button) {
    document
        .querySelectorAll(".category-btn")
        .forEach(item => {
            item.classList.remove("active");
        });

    button.classList.add("active");

    currentCategory = String(categoryId);
    pageState.size = 50;

    loadProducts();
}

/* =========================================================
   API - PRODUCTS
   ========================================================= */

async function loadProducts() {
    const requestId = ++productsRequestSequence;

    if (productsRequestController) {
        productsRequestController.abort();
    }

    productsRequestController =
        new AbortController();

    const params = new URLSearchParams();

    if (currentCategory !== "all") {
        params.set(
            "category",
            currentCategory
        );
    }

    const search =
        currentSearchTerm.trim();

    if (search) {
        params.set(
            "search",
            search
        );
    }

    const url =
        "/price/api/products/" +
        (params.toString()
            ? `?${params.toString()}`
            : "");

    setTableLoading(true);

    try {
        const response = await fetch(
            url,
            {
                method: "GET",
                credentials: "same-origin",
                signal: productsRequestController.signal,
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Products request failed");
        }

        const data = await response.json();

        if (requestId !== productsRequestSequence) {
            return;
        }

        if (!data.success) {
            showMessage(
                "خطا در دریافت محصولات",
                true
            );

            return;
        }

        const oldMap =
            new Map(
                products.map(product => [
                    product.id,
                    product
                ])
            );

        products =
            (data.products || []).map(item => {
                const old =
                    oldMap.get(item.id);

                const firstSale =
                    item.sale_types?.[0];

                const originalPrice =
                    Number(
                        item.original_price ??
                        firstSale?.price ??
                        0
                    );

                const discountedPrice =
                    Number(
                        item.discounted_price ??
                        originalPrice
                    );

                const stock =
                    Number(item.stock || 0);

                return {
                    id: item.id,
                    title: item.title,
                    mainImage: item.mainImage || "",
                    categoryIds:
                        Array.isArray(item.category)
                            ? item.category.map(
                                category =>
                                    Number(category.id)
                            )
                            : [],
                    original_price:
                        originalPrice,
                    discounted_price:
                        discountedPrice,
                    discount_percent:
                        Number(
                            item.discount_percent || 0
                        ),
                    has_active_discount:
                        Boolean(
                            item.has_active_discount
                        ),
                    currentPrice:
                        discountedPrice,
                    oldPrice:
                        Number(
                            item.last_price?.price_old ??
                            firstSale?.price ??
                            0
                        ),
                    stock,
                    product_type_title:
                        item.product_type_title ||
                        "فیزیکی",
                    enabled:
                        item.isActive !== false,
                    sale_type_id:
                        firstSale?.id ||
                        old?.sale_type_id ||
                        null,
                    isStockZero:
                        stock === 0,
                    canEditPrice: true
                };
            });

        saleTypeIdMap.clear();

        for (const product of products) {
            if (product.sale_type_id) {
                saleTypeIdMap.set(
                    product.id,
                    product.sale_type_id
                );
            }
        }

        renderAll();
        loadStats();

    } catch (error) {
        if (error.name !== "AbortError") {
            console.error(error);

            showMessage(
                "خطا در ارتباط با سرور",
                true
            );
        }
    } finally {
        if (requestId === productsRequestSequence) {
            setTableLoading(false);
        }
    }
}

/* =========================================================
   API - PRICE
   ========================================================= */

async function updatePriceOnServer(
    productId,
    newPrice
) {
    const saleTypeId =
        saleTypeIdMap.get(productId);

    if (!saleTypeId) {
        showMessage(
            "نوع فروش این محصول پیدا نشد",
            true
        );

        return false;
    }

    showRowSaving(productId);

    try {
        const response = await fetch(
            "/price/api/product/update-price/",
            {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    product_id: productId,
                    sale_type_id: saleTypeId,
                    price: newPrice,
                    source: "manual_phone"
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            showMessage(
                data.error ||
                "خطا در بروزرسانی قیمت",
                true
            );

            return false;
        }

        const product =
            products.find(
                item => item.id === productId
            );

        if (product) {
            const newServerPrice =
                Number(data.data.new_price);

            product.oldPrice =
                Number(data.data.old_price);

            product.original_price =
                newServerPrice;

            if (
                product.has_active_discount &&
                product.discount_percent > 0
            ) {
                product.discounted_price =
                    newServerPrice -
                    Math.floor(
                        (
                            newServerPrice *
                            product.discount_percent
                        ) / 100
                    );

                product.currentPrice =
                    product.discounted_price;
            } else {
                product.discounted_price =
                    newServerPrice;

                product.currentPrice =
                    newServerPrice;
            }
        }

        sparklineCache.delete(productId);

        showMessage("قیمت با موفقیت بروزرسانی شد");

        updateSingleRow(productId);
        loadStats();

        return true;

    } catch (error) {
        console.error(error);

        showMessage(
            "خطا در ارتباط با سرور",
            true
        );

        return false;

    } finally {
        hideRowSaving(productId);
    }
}

/* =========================================================
   API - STOCK
   ========================================================= */

async function updateStockOnServer(
    productId,
    newStock
) {
    showRowSaving(productId);

    try {
        const response = await fetch(
            `/price/api/product/${productId}/update-stock/`,
            {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    stock: newStock,
                    change_type: "manual"
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            showMessage(
                data.error ||
                "خطا در بروزرسانی موجودی",
                true
            );

            return false;
        }

        const product =
            products.find(
                item => item.id === productId
            );

        if (product) {
            product.stock = newStock;
            product.isStockZero =
                newStock === 0;
        }

        showMessage(
            `موجودی به ${formatNumber(newStock)} تغییر کرد`
        );

        updateSingleRow(productId);

        return true;

    } catch (error) {
        console.error(error);

        showMessage(
            "خطا در ارتباط با سرور",
            true
        );

        return false;

    } finally {
        hideRowSaving(productId);
    }
}

}

/* =========================================================
   DISCOUNT
   ========================================================= */

async function saveProductDiscount() {
    if (!currentDiscountProduct) {
        return;
    }

    const discountPercent =
        Math.max(
            0,
            Math.min(
                100,
                Number.parseInt(
                    document.getElementById(
                        "discountPercentInput"
                    ).value,
                    10
                ) || 0
            )
        );

    try {
        const response = await fetch(
            "/price/api/product/set-discount/",
            {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    product_id:
                        currentDiscountProduct.id,
                    discount_percent:
                        discountPercent
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            showMessage(
                data.error ||
                "خطا در ثبت تخفیف",
                true
            );

            return;
        }

        const product =
            products.find(
                item =>
                    item.id ===
                    currentDiscountProduct.id
            );

        if (product) {
            if (discountPercent === 0) {
                product.has_active_discount = false;
                product.discount_percent = 0;
                product.discounted_price =
                    product.original_price;
                product.currentPrice =
                    product.original_price;
            } else {
                product.has_active_discount = true;
                product.discount_percent =
                    discountPercent;

                product.discounted_price =
                    product.original_price -
                    Math.floor(
                        (
                            product.original_price *
                            discountPercent
                        ) / 100
                    );

                product.currentPrice =
                    product.discounted_price;
            }
        }

        showMessage(
            data.message ||
            "تخفیف بروزرسانی شد"
        );

        updateSingleRow(
            currentDiscountProduct.id
        );

        closeDiscountModal();

    } catch (error) {
        console.error(error);

        showMessage(
            "خطا در ارتباط با سرور",
            true
        );
    }
}

function openDiscountModal(product) {
    if (!product) {
        return;
    }

    currentDiscountProduct = product;

    document.getElementById(
        "discountProductTitle"
    ).textContent = product.title;

    document.getElementById(
        "discountPercentInput"
    ).value =
        product.discount_percent || 0;

    document.getElementById(
        "originalPriceDisplay"
    ).textContent =
        formatNumber(
            product.original_price
        );

    updateDiscountPreview();

    document
        .getElementById("discountModal")
        .classList.add("active");
}

function closeDiscountModal() {
    document
        .getElementById("discountModal")
        .classList.remove("active");

    currentDiscountProduct = null;
}

function updateDiscountPreview() {
    if (!currentDiscountProduct) {
        return;
    }

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                Number.parseInt(
                    document.getElementById(
                        "discountPercentInput"
                    ).value,
                    10
                ) || 0
            )
        );

    const discounted =
        currentDiscountProduct.original_price -
        Math.floor(
            (
                currentDiscountProduct.original_price *
                percent
            ) / 100
        );

    document.getElementById(
        "discountedPriceDisplay"
    ).textContent =
        formatNumber(discounted);
}

/* =========================================================
   ROW STATES
   ========================================================= */

function showRowSaving(productId) {
    const row =
        document.querySelector(
            `tr[data-product-id="${productId}"]`
        );

    if (row) {
        row.classList.add("row-saving");
    }

    const card =
        document.querySelector(
            `.product-card[data-product-id="${productId}"]`
        );

    if (card) {
        card.classList.add("row-saving");
    }
}

function hideRowSaving(productId) {
    const row =
        document.querySelector(
            `tr[data-product-id="${productId}"]`
        );

    if (row) {
        row.classList.remove("row-saving");
        row.classList.add("row-saved");

        setTimeout(() => {
            row.classList.remove("row-saved");
        }, 700);
    }

    const card =
        document.querySelector(
            `.product-card[data-product-id="${productId}"]`
        );

    if (card) {
        card.classList.remove("row-saving");
    }
}

/* =========================================================
   PRODUCT HTML
   ========================================================= */

function getTypeClass(typeLabel) {
    if (
        typeLabel === "دانلودی" ||
        typeLabel === "نرم افزاری"
    ) {
        return "type-download";
    }

    if (
        typeLabel === "بسته‌ای" ||
        typeLabel === "کارتنی"
    ) {
        return "type-package";
    }

    return "type-physical";
}

function buildPriceDisplay(product) {
    const hasDiscount =
        product.has_active_discount &&
        product.discount_percent > 0;

    if (!hasDiscount) {
        return `
            <span class="price-main">
                ${formatNumber(product.original_price)}
            </span>
        `;
    }

    return `
        <span class="price-discount">
            ${formatNumber(product.discounted_price)}
        </span>

        <span class="price-original">
            ${formatNumber(product.original_price)}
        </span>

        <span class="discount-badge">
            -${product.discount_percent}%
        </span>
    `;
}

function buildChangeBadge(product) {
    const percent =
        calculatePercent(
            product.oldPrice,
            product.currentPrice
        );

    if (percent > 0) {
        return `
            <span class="change-badge change-up">
                +${percent}%
            </span>
        `;
    }

    if (percent < 0) {
        return `
            <span class="change-badge change-down">
                ${percent}%
            </span>
        `;
    }

    return `
        <span class="change-badge change-same">
            0%
        </span>
    `;
}

function buildStatus(product) {
    const isOn = product.stock > 0;

    return `
        <div class="status-inline">
            <button
                type="button"
                class="toggle-btn ${isOn ? "active" : ""}"
                data-action="toggle"
                data-id="${product.id}"
                aria-label="${isOn ? "خاموش کردن" : "روشن کردن"}"
            ></button>

            <span class="status-dot ${isOn ? "on" : "off"}"></span>

            <span class="status-text">
                ${isOn ? "فعال" : "خاموش"}
            </span>
        </div>
    `;
}

function buildTableRow(product) {

    const typeLabel =

    const hasDiscount =

        <tr

        >

            <td>
                ${buildStatus(product)}
            </td>

            <td>
                <div class="product-title-cell">
                    ${highlightText(
                        product.title,
                        currentSearchTerm
                    )}
                </div>
            </td>

            <td>
                <span class="type-badge ${typeClass}">
                    ${escapeHtml(typeLabel)}
                </span>
            </td>

            <td>

            <td>
                <input

                    value="${formatNumber(product.currentPrice)}"
                    ${isStockZero

/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable() {
    const filtered =
        getFilteredProducts();

    document.getElementById(
        "searchResultsCount"
    ).textContent =
        `${formatNumber(filtered.length)} محصول`;

    const visible =
        filtered.slice(
            0,
            pageState.size
        );

    const tbody =
        document.getElementById(
            "productTableBody"
        );

    const fragment =
        document.createDocumentFragment();

    const template =
        document.createElement("template");

    let html =
        visible
            .map(buildTableRow)
            .join("");

    if (filtered.length > pageState.size) {
        html += `
            <tr>
                <td colspan="9" style="padding:10px;">
                    <button
                        type="button"
                        class="load-more-btn"
                        id="loadMoreBtn"
                    >
                        نمایش
                        ${formatNumber(
                            filtered.length -
                            pageState.size
                        )}
                        محصول دیگر
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </td>
            </tr>
        `;
    }

    template.innerHTML = html;

    fragment.append(
        ...template.content.cloneNode(true).childNodes
    );

    tbody.replaceChildren(fragment);

    const loadMore =
        document.getElementById(
            "loadMoreBtn"
        );

    if (loadMore) {
        loadMore.addEventListener(
            "click",
            () => {
                pageState.size += 50;
                renderTable();
            },
            { once: true }
        );
    }

    drawSparklinesVisible(
        visible.map(
            product => product.id
        )
    );
}

    const template =
        document.createElement("template");

    let html =
        visible
            .map(buildMobileCard)
            .join("");

    if (filtered.length > pageState.size) {
        html += `
            <button
                type="button"
                class="load-more-btn"
                id="loadMoreMobileBtn"
            >
                نمایش
                ${formatNumber(
                    filtered.length -
                    pageState.size
                )}
                محصول دیگر
                <i class="fas fa-chevron-down"></i>
            </button>
        `;
    }

    template.innerHTML = html;

    container.replaceChildren(
        template.content.cloneNode(true)
    );

    const loadMore =
        document.getElementById(
            "loadMoreMobileBtn"
        );

    if (loadMore) {
        loadMore.addEventListener(
            "click",
            () => {
                pageState.size += 50;
                renderMobile();
            },
            { once: true }
        );
    }
}

/* =========================================================
   UPDATE SINGLE ROW
   ========================================================= */

function updateSingleRow(productId) {
    const product =
        products.find(
            item => item.id === productId
        );

    if (!product) {
        return;
    }

    if (currentView === "pc") {
        const oldRow =
            document.querySelector(
                `tr[data-product-id="${productId}"]`
            );

        if (!oldRow) {
            return;
        }

        const template =
            document.createElement("template");

        template.innerHTML =
            buildTableRow(product);

        const newRow =
            template.content.firstElementChild;

        oldRow.replaceWith(newRow);

        const canvas =
            newRow.querySelector(
                ".sparkline-canvas"
            );

        if (canvas) {
            if (sparklineCache.has(productId)) {
                drawSparklineOnCanvas(
                    canvas,
                    sparklineCache.get(productId)
                );
            } else {
                drawSparklineForCanvas(
                    canvas,
                    productId
                );
            }
        }

    } else {
        const oldCard =
            document.querySelector(
                `.product-card[data-product-id="${productId}"]`
            );

        if (!oldCard) {
            return;
        }

        const template =
            document.createElement("template");

        template.innerHTML =
            buildMobileCard(product);

        oldCard.replaceWith(
            template.content.firstElementChild
        );
    }
}

/* =========================================================
   HISTORY
   ========================================================= */

function renderHistory() {
    const container =
        document.getElementById(
            "historyList"
        );

    if (!priceHistory.length) {
        container.innerHTML = `
            <div style="
                color:#94a3b8;
                padding:12px;
                font-size:.65rem;
                text-align:center;
            ">
                هنوز تغییری ثبت نشده است
            </div>
        `;

        return;
    }

    const items =
        priceHistory
            .slice(0, 15)
            .map(item => {
                const percent =
                    Number(item.percent || 0);

                const color =
                    percent > 0
                        ? "#059669"
                        : percent < 0
                            ? "#dc2626"
                            : "#94a3b8";

                return `
                    <div class="history-item">

                        <strong>
                            ${escapeHtml(
                                item.productTitle
                            )}
                        </strong>

                        <div>
                            ${formatNumber(item.oldPrice)}
                            →
                            ${formatNumber(item.newPrice)}

                            <span
                                style="
                                    color:${color};
                                    font-weight:800;
                                    margin-right:4px;
                                "
                            >
                                ${percent > 0 ? "+" : ""}
                                ${percent}%
                            </span>
                        </div>

                        <div class="history-date">
                            ${escapeHtml(item.date)}
                        </div>

                    </div>
                `;
            })
            .join("");

    container.innerHTML = items;
}

/* =========================================================
   RENDER ALL
   ========================================================= */

function renderAll() {
    if (currentView === "pc") {
        renderTable();
    } else {
        renderMobile();
    }

    const activeCount =
        products.filter(
            product => product.stock > 0
        ).length;

    document.getElementById(
        "totalProducts"
    ).textContent =
        formatNumber(products.length);

    document.getElementById(
        "activeCount"
    ).textContent =
        formatNumber(activeCount);
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */

function setupEventDelegation() {
    const tbody =
        document.getElementById(
            "productTableBody"
        );

    tbody.addEventListener(
        "input",
        event => {
            const input =
                event.target.closest(
                    ".price-input"
                );

            if (!input) {
                return;
            }

            const raw =
                parseNumber(input.value);

            input.value =
                formatNumber(raw);
        }
    );

    const debouncedPriceUpdate =
        debounce(input => {
            const productId =
                Number.parseInt(
                    input.dataset.id,
                    10
                );

            const price =
                parseNumber(input.value);

            const product =
                products.find(
                    item =>
                        item.id === productId
                );

            if (
                price > 0 &&
                product &&
                price !== product.currentPrice
            ) {
                updatePriceOnServer(
                    productId,
                    price
                );
            }
        }, 650);

    tbody.addEventListener(
        "blur",
        event => {
            const input =
                event.target.closest(
                    ".price-input"
                );

            if (input) {
                debouncedPriceUpdate(input);
            }
        },
        true
    );

    tbody.addEventListener(
        "keydown",
        event => {
            if (
                event.target.matches(
                    ".price-input"
                ) &&
                event.key === "Enter"
            ) {
                event.preventDefault();
                event.target.blur();
            }
        }
    );

    tbody.addEventListener(
        "change",
        event => {
            const input =
                event.target.closest(
                    ".stock-input"
                );

            if (!input) {
                return;
            }

            const productId =
                Number.parseInt(
                    input.dataset.id,
                    10
                );

            updateStockOnServer(
                productId,
                parseNumber(input.value)
            );
        }
    );

    tbody.addEventListener(
        "click",
        event => {
            const actionElement =
                event.target.closest(
                    "[data-action]"
                );

            if (!actionElement) {
                return;
            }

            const productId =
                Number.parseInt(
                    actionElement.dataset.id,
                    10
                );

            const action =
                actionElement.dataset.action;

            if (action === "toggle") {
                toggleProductStock(productId);
                return;
            }

            if (action === "discount") {
                const product =
                    products.find(
                        item =>
                            item.id === productId
                    );

                openDiscountModal(product);
            }
        }
    );

    const mobileContainer =
        document.getElementById(
            "mobileCardsContainer"
        );

    mobileContainer.addEventListener(
        "click",
        event => {
            const actionElement =
                event.target.closest(
                    "[data-action]"
                );

            if (!actionElement) {
                return;
            }

            const productId =
                Number.parseInt(
                    actionElement.dataset.id,
                    10
                );

            const action =
                actionElement.dataset.action;

            if (action === "toggle") {
                toggleProductStock(productId);
                return;
            }

            if (action === "discount") {
                const product =
                    products.find(
                        item =>
                            item.id === productId
                    );

                openDiscountModal(product);
                return;
            }

            if (action === "edit-price") {
                const product =
                    products.find(
                        item =>
                            item.id === productId
                    );

                if (!product) {
                    return;
                }

                const value =
                    prompt(
                        `قیمت جدید برای «${product.title}»:`,
                        formatNumber(
                            product.currentPrice
                        )
                    );

                if (value === null) {
                    return;
                }

                const price =
                    parseNumber(value);

                if (price <= 0) {
                    showMessage(
                        "قیمت وارد شده معتبر نیست",
                        true
                    );

                    return;
                }

                updatePriceOnServer(
                    productId,
                    price
                );
            }
        }
    );

    mobileContainer.addEventListener(
        "change",
        event => {
            const input =
                event.target.closest(
                    ".mobile-stock-input"
                );

            if (!input) {
                return;
            }

            const productId =
                Number.parseInt(
                    input.dataset.stockId,
                    10
                );

            updateStockOnServer(
                productId,
                parseNumber(input.value)
            );
        }
    );
}

/* =========================================================
   INIT
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {
        setupEventDelegation();

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const searchClear =
            document.getElementById(
                "searchClearBtn"
            );

        const debouncedSearch =
            debounce(value => {
                currentSearchTerm =
                    value.trim();

                pageState.size = 50;

                loadProducts();
            }, 300);

        searchInput.addEventListener(
            "input",
            event => {
                const value =
                    event.target.value;

                searchClear.style.display =
                    value
                        ? "grid"
                        : "none";

                debouncedSearch(value);
            }
        );

        searchClear.addEventListener(
            "click",
            () => {
                searchInput.value = "";
                currentSearchTerm = "";
                searchClear.style.display = "none";
                pageState.size = 50;
                loadProducts();
                searchInput.focus();
            }
        );

        document
            .getElementById("switchViewBtn")
            .addEventListener(
                "click",
                () => {
                    if (currentView === "pc") {
                        currentView = "mobile";

                        document
                            .getElementById("tableView")
                            .style.display = "none";

                        document
                            .getElementById("mobileView")
                            .classList.add("active");

                        document
                            .getElementById("switchViewBtn")
                            .innerHTML =
                            '<i class="fas fa-desktop"></i> نمای کامپیوتر';

                    } else {
                        currentView = "pc";

                        document
                            .getElementById("tableView")
                            .style.display = "block";

                        document
                            .getElementById("mobileView")
                            .classList.remove("active");

                        document
                            .getElementById("switchViewBtn")
                            .innerHTML =
                            '<i class="fas fa-mobile-screen"></i> نمای موبایل';
                    }

                    renderAll();
                }
            );

        document
            .getElementById("excelPasteBtn")
            .addEventListener(
                "click",
                () => {
                    const text =
                        prompt(
                            "قیمت‌ها را خط به خط و مطابق ترتیب محصولات وارد کنید:"
                        );

                    if (!text) {
                        return;
                    }

                    const lines =
                        text
                            .split(/\r?\n/)
                            .map(line => line.trim())
                            .filter(Boolean);

                    const filtered =
                        getFilteredProducts();

                    let updatedCount = 0;

                    const requests = [];

                    for (
                        let index = 0;
                        index <
                        Math.min(
                            lines.length,
                            filtered.length
                        );
                        index++
                    ) {
                        const price =
                            parseNumber(
                                lines[index]
                            );

                        if (
                            price > 0 &&
                            price !==
                                filtered[index]
                                    .currentPrice
                        ) {
                            updatedCount++;

                            requests.push(
                                updatePriceOnServer(
                                    filtered[index].id,
                                    price
                                )
                            );
                        }
                    }

                    if (!updatedCount) {
                        showMessage(
                            "قیمت جدیدی برای بروزرسانی پیدا نشد",
                            true
                        );

                        return;
                    }

                    showMessage(
                        `${updatedCount} قیمت در حال بروزرسانی است`
                    );

                    Promise.allSettled(requests)
                        .then(() => {
                            loadStats();
                        });
                }
            );

        document
            .getElementById(
                "closeDiscountModalBtn"
            )
            .addEventListener(
                "click",
                closeDiscountModal
            );

        document
            .getElementById(
                "discountModalCancelBtn"
            )
            .addEventListener(
                "click",
                closeDiscountModal
            );

        document
            .getElementById(
                "discountModalSaveBtn"
            )
            .addEventListener(
                "click",
                saveProductDiscount
            );

        document
            .getElementById(
                "discountPercentInput"
            )
            .addEventListener(
                "input",
                updateDiscountPreview
            );

        document
            .querySelectorAll(
                ".quick-discount-preset"
            )
            .forEach(button => {
                button.addEventListener(
                    "click",
                    () => {
                        document
                            .getElementById(
                                "discountPercentInput"
                            )
                            .value =
                            button.dataset.discount;

                        updateDiscountPreview();
                    }
                );
            });

        document
            .getElementById("discountModal")
            .addEventListener(
                "click",
                event => {
                    if (
                        event.target ===
                        document.getElementById(
                            "discountModal"
                        )
                    ) {
                        closeDiscountModal();
                    }
                }
            );

        document.addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Escape" &&
                    document
                        .getElementById(
                            "discountModal"
                        )
                        .classList.contains("active")
                ) {
                    closeDiscountModal();
                }
            }
        );

        loadCategories();
        loadProducts();
        loadStats();
    }
);
</script>
