<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>پنل مدیریت قیمت | مرجع قیمت ایران</title>
    <link rel="stylesheet" href="https://lib.arvancloud.ir/font-awesome/6.3.0/css/all.css">
    <style>
        /* ============ RESET & BASE ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --bg: #f5f6fa;
            --bg-soft: #eef0f7;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
            --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
            --shadow-lg: 0 12px 28px rgba(15,23,42,0.12);
            --shadow-inset: inset 0 1px 2px rgba(15,23,42,0.04);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }
        html, body {
            font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f5f6fa 0%, #eef0f7 100%);
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            padding: 14px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #cbd5e0, #94a3b8);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* ============ HEADER ============ */
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #8b5cf6 100%);
            color: white;
            padding: 22px 20px;
            border-radius: var(--radius-xl);
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 32px -8px rgba(79,70,229,0.4);
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -60%;
            left: -5%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .header h1 {
            font-size: 1.25rem;
            margin-bottom: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.3px;
        }
        .header h1 i {
            background: rgba(255,255,255,0.2);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }
        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s var(--transition);
            font-weight: 500;
        }
        .stat-card:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }
        .stat-card i { opacity: 0.9; font-size: 0.75rem; }

        /* ============ TOOLBAR ============ */
        .toolbar {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .search-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-soft);
            border-radius: 40px;
            padding: 0 16px;
            border: 2px solid transparent;
            transition: all 0.25s var(--transition);
        }
        .search-box:focus-within {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }
        .search-box i {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .search-box:focus-within i { color: var(--primary); }
        .search-box input {
            flex: 1;
            padding: 11px 10px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            color: var(--text);
            font-family: inherit;
        }
        .search-box input:focus { outline: none; }
        .search-box input::placeholder { color: #94a3b8; }
        .search-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: none;
            padding: 4px;
            transition: color 0.2s;
        }
        .search-clear:hover { color: var(--danger); }
        .search-results-count {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 6px;
            padding-right: 16px;
            font-weight: 500;
        }

        /* ============ BUTTONS ============ */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            transition: all 0.25s var(--transition);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 14px -4px rgba(99,102,241,0.5);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px -4px rgba(99,102,241,0.6);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: var(--bg-soft);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: white;
            border-color: var(--primary-light);
            color: var(--primary);
        }

        /* ============ CATEGORY FILTER ============ */
        .category-filter {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            margin-bottom: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .category-filter::-webkit-scrollbar { display: none; }
        .category-filter button {
            padding: 8px 18px;
            border: 1.5px solid var(--border);
            border-radius: 40px;
            background: white;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            transition: all 0.25s var(--transition);
            font-family: inherit;
        }
        .category-filter button:hover {
            border-color: var(--primary-light);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .category-filter button.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 12px -4px rgba(99,102,241,0.5);
        }

        /* ============ TABLE ============ */
        .table-container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }
        .product-table th {
            background: linear-gradient(180deg, #fafbfd 0%, #f4f6fb 100%);
            padding: 14px 12px;
            text-align: right;
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-bottom: 1.5px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 5;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }
        .product-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .product-table tbody tr {
            transition: all 0.2s var(--transition);
        }
        .product-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(99,102,241,0.03), rgba(139,92,246,0.03));
        }
        .product-table tbody tr.disabled-row {
            background: rgba(148,163,184,0.05);
        }
        .product-table tbody tr.disabled-row:hover {
            background: rgba(148,163,184,0.08);
        }

        /* ============ INPUTS ============ */
        .price-input, .stock-input {
            width: 120px;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.85rem;
            text-align: left;
            transition: all 0.25s var(--transition);
            background: var(--bg-soft);
            color: var(--text);
            font-weight: 600;
        }
        .price-input:hover, .stock-input:hover {
            border-color: #cbd5e0;
            background: white;
        }
        .price-input:focus, .stock-input:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
        }

        /* ============ TOGGLE BUTTON ============ */
        .toggle-btn {
            width: 48px;
            height: 26px;
            background: #cbd5e0;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s var(--transition);
            box-shadow: inset 0 2px 4px rgba(15,23,42,0.08);
        }
        .toggle-btn:hover { background: #b8c1cf; }
        .toggle-btn.active {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            box-shadow: 0 4px 10px -2px rgba(16,185,129,0.4);
        }
        .toggle-btn::after {
            content: '';
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            right: 3px;
            transition: all 0.3s var(--transition);
            box-shadow: 0 2px 4px rgba(15,23,42,0.15);
        }
        .toggle-btn.active::after { right: 23px; }

        /* ============ BADGES ============ */
        .badge-increase {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 700;
            display: inline-block;
            white-space: nowrap;
        }
        .badge-decrease {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 700;
            display: inline-block;
            white-space: nowrap;
        }
        .badge-same {
            background: #f1f5f9;
            color: #64748b;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 700;
            display: inline-block;
            white-space: nowrap;
        }
        .type-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 600;
        }
        .type-physical { background: #d1fae5; color: #065f46; }
        .type-download { background: #dbeafe; color: #1e40af; }
        .type-package { background: #fef3c7; color: #92400e; }

        .price-discount {
            color: var(--success-dark);
            font-weight: 800;
            font-size: 0.88rem;
        }
        .price-original {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 0.72rem;
            margin-right: 5px;
        }
        .stock-zero-badge {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.66rem;
            font-weight: 700;
            margin-right: 5px;
            white-space: nowrap;
        }
        .stock-on-badge {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.66rem;
            font-weight: 700;
            margin-right: 5px;
            white-space: nowrap;
        }
        .discount-badge {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 0.66rem;
            font-weight: 700;
            margin-right: 5px;
        }

        .sparkline-canvas { width: 100px; height: 40px; display: block; }

        /* ============ DISCOUNT BUTTON ============ */
        .btn-discount {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            border: none;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.25s var(--transition);
            font-family: inherit;
            white-space: nowrap;
            box-shadow: 0 2px 6px -2px rgba(245,158,11,0.3);
        }
        .btn-discount:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px -2px rgba(245,158,11,0.5);
        }
        .btn-discount.has-discount {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white;
            box-shadow: 0 2px 8px -2px rgba(16,185,129,0.4);
        }

        /* ============ ROW STATES ============ */
        .row-saving {
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .row-saved {
            animation: savedFlash 1s ease;
        }
        @keyframes savedFlash {
            0% { background: linear-gradient(90deg, #d1fae5, #a7f3d0); }
            100% { background: transparent; }
        }

        /* ============ MOBILE ============ */
        .mobile-view {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .mobile-view.active { display: flex; }
        .product-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: all 0.25s var(--transition);
        }
        .product-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .product-card.disabled-card {
            background: linear-gradient(135deg, #fafbfd, #f4f6fb);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1.5px solid #f1f5f9;
        }
        .product-info-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .product-img {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(99,102,241,0.1);
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-title {
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: var(--text);
        }
        .mobile-toggle-btn {
            width: 46px;
            height: 24px;
            background: #cbd5e0;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.3s var(--transition);
            box-shadow: inset 0 2px 4px rgba(15,23,42,0.08);
        }
        .mobile-toggle-btn.active {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            box-shadow: 0 3px 8px -2px rgba(16,185,129,0.4);
        }
        .mobile-toggle-btn::after {
            content: '';
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            right: 2px;
            transition: all 0.3s var(--transition);
            box-shadow: 0 2px 4px rgba(15,23,42,0.15);
        }
        .mobile-toggle-btn.active::after { right: 22px; }

        .price-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .price-info-item {
            background: linear-gradient(135deg, #fafbfd, #f4f6fb);
            padding: 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #eef0f7;
            transition: all 0.2s;
        }
        .price-info-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .price-info-value {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .stock-badge {
            display: inline-block;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .stock-badge.low {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
        }
        .more-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 11px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            transition: all 0.25s var(--transition);
            box-shadow: 0 4px 12px -4px rgba(99,102,241,0.5);
        }
        .more-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px -4px rgba(99,102,241,0.6);
        }
        .mobile-discount-btn {
            border: none;
            border-radius: 40px;
            padding: 11px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            color: white;
            transition: all 0.25s var(--transition);
        }
        .mobile-discount-btn.no-discount {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 12px -4px rgba(245,158,11,0.5);
        }
        .mobile-discount-btn.has-discount {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            box-shadow: 0 4px 12px -4px rgba(16,185,129,0.5);
        }

        /* ============ MODAL ============ */
        .full-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .full-modal.active { display: flex; }
        .full-modal-content {
            background: white;
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: fadeInScale 0.3s var(--transition);
            box-shadow: 0 30px 60px -15px rgba(15,23,42,0.4);
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.94) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @media (max-width: 768px) {
            .full-modal { align-items: flex-end; padding: 0; }
            .full-modal-content {
                width: 100%;
                max-width: 100%;
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                animation: slideUp 0.35s var(--transition);
                max-height: 92vh;
            }
            @keyframes slideUp {
                from { opacity: 0; transform: translateY(100%); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
        .modal-header {
            background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            color: white;
            padding: 22px;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            position: sticky;
            top: 0;
            z-index: 2;
            overflow: hidden;
        }
        .modal-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%;
        }
        .modal-header-top {
            display: flex;

<script>
/* ============================================================
   APP STATE
   ============================================================ */
let products = [];
let priceHistory = [];
let currentView = 'pc';
let currentSearchTerm = '';
let currentCategory = 'all';
let currentDiscountProduct = null;
const saleTypeIdMap = new Map();
const sparklineCache = new Map();
const sparklineInFlight = new Map();
const pageState = { size: 50 };

/* ============================================================
   HELPERS
   ============================================================ */
function formatNumber(num) {
    return num?.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") || "0";
}

function parseNumber(str) {
    const num = parseInt(str?.toString().replace(/[^0-9]/g, ''));
    return isNaN(num) ? 0 : num;
}

function calculatePercent(oldPrice, newPrice) {
    if (oldPrice === 0) return 0;
    return ((newPrice - oldPrice) / oldPrice * 100).toFixed(1);
}

function debounce(fn, delay) {
    let t;
    return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), delay);
    };
}

function throttle(fn, delay) {
    let last = 0, timer;
    return function(...args) {
        const now = Date.now();
        const remaining = delay - (now - last);
        if (remaining <= 0) {
            last = now;
            fn.apply(this, args);
        } else if (!timer) {
            timer = setTimeout(() => {
                last = Date.now();
                timer = null;
                fn.apply(this, args);
            }, remaining);
        }
    };
}

let toastTimer;
function showMessage(msg, isError = false) {
    const toast = document.getElementById('toastMessage');
    toast.textContent = msg;
    toast.style.background = isError
        ? 'linear-gradient(135deg, #ef4444, #dc2626)'
        : 'linear-gradient(135deg, #10b981, #059669)';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
}

function highlightText(text, search) {
    const safe = escapeHtml(text);
    if (!search) return safe;
    const regex = new RegExp(`(${search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return safe.replace(regex, `<span style="background:#fef08a;border-radius:4px;padding:0 2px">$1</span>`);
}

function getFilteredProducts() {
    let filtered = products;
    if (currentCategory !== 'all') {
        const catId = parseInt(currentCategory);
        filtered = filtered.filter(p => p.categoryIds && p.categoryIds.includes(catId));
    }
    if (currentSearchTerm.trim()) {
        const s = currentSearchTerm.toLowerCase();
        filtered = filtered.filter(p => p.title.toLowerCase().includes(s));
    }
    return filtered;
}

/* ============================================================
   SPARKLINE
   ============================================================ */
function drawSparklineOnCanvas(canvas, prices) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 100;
    const h = canvas.clientHeight || 40;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    if (!prices || prices.length < 2) {
        ctx.strokeStyle = '#cbd5e0';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        return;
    }

    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const range = maxPrice - minPrice;
    const isUp = prices[prices.length - 1] >= prices[0];
    const lineColor = isUp ? "#10b981" : "#ef4444";

    // gradient fill
    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, isUp ? 'rgba(16,185,129,0.25)' : 'rgba(239,68,68,0.25)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');

    const points = prices.map((p, i) => {
        const x = (i / (prices.length - 1)) * w;
        const y = range > 0 ? h - ((p - minPrice) / range) * (h - 8) - 4 : h / 2;
        return { x, y };
    });

    // area
    ctx.beginPath();
    ctx.moveTo(points[0].x, h);
    points.forEach(pt => ctx.lineTo(pt.x, pt.y));
    ctx.lineTo(points[points.length - 1].x, h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // line
    ctx.beginPath();
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    points.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    });
    ctx.stroke();

    // dot
    const last = points[points.length - 1];
    ctx.fillStyle = lineColor;
    ctx.beginPath();
    ctx.arc(last.x - 2, last.y, 3.5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(last.x - 2, last.y, 1.5, 0, 2 * Math.PI);
    ctx.fill();
}

function drawSparklineForCanvas(canvas, productId) {
    if (!canvas) return;
    if (sparklineCache.has(productId)) {
        drawSparklineOnCanvas(canvas, sparklineCache.get(productId));
        return;
    }
    if (sparklineInFlight.has(productId)) {
        sparklineInFlight.get(productId).then(prices => {
            const c = document.querySelector(`.sparkline-canvas[data-id="${productId}"]`);
            if (c) drawSparklineOnCanvas(c, prices);
        });
        return;
    }
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.clientWidth || 100;
    canvas.height = canvas.clientHeight || 40;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();

    const promise = fetch(`/price/api/product/${productId}/price-history/?limit=12`)
        .then(r => r.json())
        .then(data => {
            const prices = (data.history || []).map(h => h.price_new).reverse();
            sparklineCache.set(productId, prices);
            return prices;
        })
        .catch(() => {
            sparklineCache.set(productId, []);
            return [];
        })
        .finally(() => sparklineInFlight.delete(productId));

    sparklineInFlight.set(productId, promise);
}

async function drawSparklinesBatched(productIds) {
    const queue = productIds.filter(id => !sparklineCache.has(id));
    productIds.forEach(id => {
        if (sparklineCache.has(id)) {
            const c = document.querySelector(`.sparkline-canvas[data-id="${id}"]`);
            if (c) drawSparklineOnCanvas(c, sparklineCache.get(id));
        }
    });

    let idx = 0;
    const worker = async () => {
        while (idx < queue.length) {
            const pid = queue[idx++];
            await new Promise(resolve => {
                drawSparklineForCanvas(
                    document.querySelector(`.sparkline-canvas[data-id="${pid}"]`),
                    pid
                );
                setTimeout(resolve, 50);
            });
        }
    };
    await Promise.all(Array.from({ length: 5 }, worker));
}

/* ============================================================
   API CALLS
   ============================================================ */
const loadStats = throttle(async function() {
    try {
        const res = await fetch('/price/api/dashboard-stats/');
        const data = await res.json();
        if (data.success) {
            document.getElementById('totalProducts').innerText = data.stats.total_products;
            document.getElementById('activeCount').innerText = data.stats.total_products - (data.stats.out_of_stock || 0);
            document.getElementById('todayChanges').innerText = data.stats.today_changes;
            const avg = data.stats.avg_change_today;
            document.getElementById('avgIncrease').innerHTML =
                avg > 0 ? `🟢 +${avg}%` : (avg < 0 ? `🔴 ${avg}%` : '⚪ 0%');

            if (data.latest_changes) {
                priceHistory = data.latest_changes.map(ch => ({
                    productTitle: ch.product_title,
                    oldPrice: ch.old_price,
                    newPrice: ch.new_price,
                    percent: ch.percent_change,
                    date: ch.created_at
                }));
                renderHistory();
            }
        }
    } catch (e) { console.error(e); }
}, 1500);

async function loadCategories() {
    try {
        const res = await fetch('/price/api/categories/');
        const data = await res.json();
        if (data.success) {
            const container = document.getElementById('categoryFilter');
            const frag = document.createDocumentFragment();

            const allBtn = document.createElement('button');
            allBtn.className = 'category-btn active';
            allBtn.dataset.category = 'all';
            allBtn.innerHTML = '<i class="fas fa-layer-group"></i> همه';
            allBtn.addEventListener('click', () => selectCategory('all', allBtn));
            frag.appendChild(allBtn);

            data.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.dataset.category = cat.id;
                btn.innerHTML = `<i class="fas fa-tag"></i> ${escapeHtml(cat.title)} ${cat.parent ? `(${escapeHtml(cat.parent.title)})` : ''}`;
                btn.addEventListener('click', () => selectCategory(cat.id, btn));
                frag.appendChild(btn);
            });

            container.replaceChildren(frag);
        }
    } catch (e) { console.error(e); }
}

function selectCategory(catId, btn) {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = catId;
    pageState.size = 50;
    loadProducts();
}

async function loadProducts() {
    try {
        const params = new URLSearchParams();
        if (currentCategory !== 'all') params.append('category', currentCategory);
        if (currentSearchTerm) params.append('search', currentSearchTerm);
        const url = '/price/api/products/' + (params.toString() ? '?' + params.toString() : '');

        const res = await fetch(url);
        const data = await res.json();
        if (data.success) {
            const oldMap = new Map(products.map(p => [p.id, p]));
            products = data.products.map(p => {
                const old = oldMap.get(p.id);
                return {
                    id: p.id,
                    title: p.title,
                    imgIcon: p.mainImage
                        ? `<img src="${p.mainImage}" loading="lazy" alt="" />`
                        : '📦',
                    categoryIds: p.category.map(c => c.id),
                    original_price: p.original_price || (p.sale_types[0]?.price || 0),
                    discounted_price: p.discounted_price || (p.sale_types[0]?.price || 0),
                    discount_percent: p.discount_percent || 0,
                    has_active_discount: p.has_active_discount || false,
                    currentPrice: p.discounted_price || (p.sale_types[0]?.price || 0),
                    oldPrice: p.last_price?.price_old || (p.sale_types[0]?.price || 0),
                    stock: p.stock,
                    product_type_title: p.product_type_title || 'فیزیکی',
                    enabled: p.isActive,
                    sale_type_id: p.sale_types[0]?.id,
                    isStockZero: p.stock === 0,
                    canEditPrice: true
                };
            });
            products.forEach(p => {
                if (p.sale_type_id) saleTypeIdMap.set(p.id, p.sale_type_id);
            });
            renderAll();
            loadStats();
        } else {
            showMessage('خطا در دریافت محصولات', true);
        }
    } catch (e) {
        showMessage('خطا در ارتباط با سرور', true);
        console.error(e);
    }
}

async function updatePriceOnServer(productId, newPrice) {
    const sid = saleTypeIdMap.get(productId);
    if (!sid) {
        showMessage('نوع فروش برای این محصول یافت نشد', true);
        return false;
    }

    showRowSaving(productId);
    try {
        const res = await fetch('/price/api/product/update-price/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                product_id: productId,
                sale_type_id: sid,
                price: newPrice,
                source: 'manual_phone'
            })
        });
        const data = await res.json();
        if (data.success) {
            const product = products.find(p => p.id === productId);
            if (product) {
                product.oldPrice = data.data.old_price;
                product.original_price = data.data.new_price;
                if (product.has_active_discount && product.discount_percent > 0) {
                    product.discounted_price = data.data.new_price -
                        Math.floor((data.data.new_price * product.discount_percent) / 100);
                    product.currentPrice = product.discounted_price;
                } else {
                    product.currentPrice = data.data.new_price;
                }
            }
            showMessage(`✅ قیمت به‌روز شد`);
            updateSingleRow(productId);
            loadStats();
            return true;
        } else {
            showMessage(data.error || 'خطا در بروزرسانی', true);
            return false;
        }
    } catch (e) {
        showMessage('خطا در شبکه', true);
        return false;
    } finally {
        hideRowSaving(productId);
    }
}

async function updateStockOnServer(productId, newStock) {
    showRowSaving(productId);
    try {
        const res = await fetch(`/price/api/product/${productId}/update-stock/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stock: newStock, change_type: 'manual' })
        });
        const data = await res.json();
        if (data.success) {
            showMessage(`✅ موجودی به ${newStock} تغییر کرد`);
            const p = products.find(x => x.id === productId);
            if (p) {
                p.stock = newStock;
                p.isStockZero = newStock === 0;
            }
            updateSingleRow(productId);
            return true;
        } else {
            showMessage(data.error || 'خطا در بروزرسانی', true);
            return false;
        }
    } catch (e) {
        showMessage('خطا در ارتباط', true);
        return false;
    } finally {
        hideRowSaving(productId);
    }
}

async function toggleProductStock(productId) {
    showRowSaving(productId);
    try {
        const res = await fetch(`/price/api/product/${productId}/toggle/`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            showMessage(data.message);
            const p = products.find(x => x.id === productId);
            if (p) {
                p.stock = data.stock;
                p.isStockZero = data.stock === 0;
            }
            updateSingleRow(productId);
        } else {
            showMessage(data.error || 'خطا در تغییر وضعیت', true);
        }
    } catch (e) {
        showMessage('خطا در ارتباط', true);
        console.error(e);
    } finally {
        hideRowSaving(productId);
    }
}

/* ============================================================
   DISCOUNT
   ============================================================ */
async function saveProductDiscount() {
    if (!currentDiscountProduct) return;
    const discountPercent = parseInt(document.getElementById('discountPercentInput').value) || 0;
    if (discountPercent < 0 || discountPercent > 100) {
        showMessage('درصد تخفیف باید بین 0 تا 100 باشد', true);
        return;
    }
    try {
        const res = await fetch('/price/api/product/set-discount/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                product_id: currentDiscountProduct.id,
                discount_percent: discountPercent
            })
        });
        const data = await res.json();
        if (data.success) {
            showMessage(data.message);
            const p = products.find(x => x.id === currentDiscountProduct.id);
            if (p) {
                if (discountPercent === 0) {
                    p.has_active_discount = false;
                    p.discount_percent = 0;
                    p.discounted_price = p.original_price;
                    p.currentPrice = p.original_price;
                } else {
                    p.has_active_discount = true;
                    p.discount_percent = discountPercent;
                    p.discounted_price = p.original_price - Math.floor((p.original_price * discountPercent) / 100);
                    p.currentPrice = p.discounted_price;
                }
            }
            updateSingleRow(currentDiscountProduct.id);
            closeDiscountModal();
        } else {
            showMessage(data.error || 'خطا در ثبت تخفیف', true);
        }
    } catch (e) {
        showMessage('خطا در ارتباط با سرور', true);
        console.error(e);
    }
}

function openDiscountModal(product) {
    if (!product) return;
    currentDiscountProduct = product;
    document.getElementById('discountProductTitle').innerText = product.title;
    document.getElementById('discountPercentInput').value = product.discount_percent || 0;
    document.getElementById('originalPriceDisplay').innerText = formatNumber(product.original_price);
    const discounted = product.has_active_discount
        ? product.original_price - Math.floor((product.original_price * product.discount_percent) / 100)
        : product.original_price;
    document.getElementById('discountedPriceDisplay').innerText = formatNumber(discounted);
    document.getElementById('discountModal').classList.add('active');
}

function closeDiscountModal() {
    document.getElementById('discountModal').classList.remove('active');
    currentDiscountProduct = null;
}

function updateDiscountPreview() {
    if (!currentDiscountProduct) return;
    const percent = parseInt(document.getElementById('discountPercentInput').value) || 0;
    const discounted = currentDiscountProduct.original_price -
        Math.floor((currentDiscountProduct.original_price * percent) / 100);
    document.getElementById('discountedPriceDisplay').innerText = formatNumber(discounted);
}

/* ============================================================
   ROW STATES
   ============================================================ */
function showRowSaving(productId) {
    const row = document.querySelector(`tr[data-product-id="${productId}"]`);
    if (row) row.classList.add('row-saving');
    const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
    if (card) card.classList.add('row-saving');
}

function hideRowSaving(productId) {
    const row = document.querySelector(`tr[data-product-id="${productId}"]`);
    if (row) {
        row.classList.remove('row-saving');
        row.classList.add('row-saved');
        setTimeout(() => row.classList.remove('row-saved'), 1000);
    }
    const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
    if (card) card.classList.remove('row-saving');
}

/* ============================================================
   BUILD ROW
   ============================================================ */
function buildTableRow(product) {
    const percent = calculatePercent(product.oldPrice, product.currentPrice);
    let badgeClass = 'badge-same', badgeText = '۰%';
    if (percent > 0) { badgeClass = 'badge-increase'; badgeText = `🟢 +${percent}%`; }
    else if (percent < 0) { badgeClass = 'badge-decrease'; badgeText = `🔴 ${percent}%`; }

    const isStockZero = product.stock === 0;
    const typeLabel = product.product_type_title;
    const hasDiscount = product.has_active_discount && product.discount_percent > 0;

    let priceDisplay = '';
    if (hasDiscount) {
        priceDisplay = `<span class="price-discount">${formatNumber(product.discounted_price)}</span>
                        <span class="price-original">${formatNumber(product.original_price)}</span>
                        <span class="discount-badge">-${product.discount_percent}%</span>`;
    } else {
        priceDisplay = `<span>${formatNumber(product.original_price)}</span>`;
    }

    let typeClass = 'type-physical';
    if (typeLabel === 'دانلودی' || typeLabel === 'نرم افزاری') typeClass = 'type-download';
    else if (typeLabel === 'بسته‌ای' || typeLabel === 'کارتنی') typeClass = 'type-package';

    return `<tr data-product-id="${product.id}" class="${isStockZero ? 'disabled-row' : ''}">
        <td style="white-space: nowrap;">
            <button class="toggle-btn ${!isStockZero ? 'active' : ''}" data-action="toggle" data-id="${product.id}"></button>
            ${isStockZero
                ? '<span class="stock-zero-badge">خاموش</span>'
                : '<span class="stock-on-badge">روشن</span>'}
        </td>
        <td>${highlightText(product.title, currentSearchTerm)}</td>
        <td><span class="type-badge ${typeClass}">${escapeHtml(typeLabel)}</span></td>
        <td>${priceDisplay}</td>
        <td>
            <input type="text" class="price-input" data-id="${product.id}"
                   value="${formatNumber(product.currentPrice)}"
                   ${isStockZero ? 'style="border-color:#fbbf24;background:#fffbeb;"' : ''}
                   title="${isStockZero ? 'محصول خاموش - اما می‌توانید قیمت را تغییر دهید' : 'قیمت را تغییر دهید'}">
        </td>
        <td><input type="number" class="stock-input" data-id="${product.id}" value="${product.stock}" style="width:80px"></td>
        <td><span class="${badgeClass}">${badgeText}</span></td>
        <td><canvas class="sparkline-canvas" data-id="${product.id}" width="100" height="40"></canvas></td>
        <td>
            <button class="btn-discount ${hasDiscount ? 'has-discount' : ''}" data-action="discount" data-id="${product.id}">
                <i class="fas fa-tag"></i> ${hasDiscount ? `${product.discount_percent}%` : 'تنظیم تخفیف'}
            </button>
        </td>
    </tr>`;
}

function buildMobileCard(product) {
    const percent = calculatePercent(product.oldPrice, product.currentPrice);
    const isStockZero = product.stock === 0;
    const typeLabel = product.product_type_title;
    const hasDiscount = product.has_active_discount && product.discount_percent > 0;

    let typeClass = 'type-physical';
    if (typeLabel === 'دانلودی' || typeLabel === 'نرم افزاری') typeClass = 'type-download';
    else if (typeLabel === 'بسته‌ای' || typeLabel === 'کارتنی') typeClass = 'type-package';

    const changeIcon = percent > 0 ? '🟢' : (percent < 0 ? '🔴' : '⚪');
    const stockClass = isStockZero ? 'low' : '';
    const stockText = isStockZero ? 'خاموش' : `${formatNumber(product.stock)} عدد`;

    let priceDisplay = '';
    if (hasDiscount) {
        priceDisplay = `<div class="price-info-item">
                            <div class="price-info-label">قیمت</div>
                            <div class="price-info-value">
                                <span class="price-discount">${formatNumber(product.discounted_price)}</span>
                                <span class="price-original">${formatNumber(product.original_price)}</span>
                            </div>
                        </div>
                        <div class="price-info-item">
                            <div class="price-info-label">تخفیف</div>
                            <div class="price-info-value" style="color:#d97706">-${product.discount_percent}%</div>
                        </div>`;
    } else {
        priceDisplay = `<div class="price-info-item">
                            <div class="price-info-label">قیمت</div>
                            <div class="price-info-value">${formatNumber(product.original_price)}</div>
                        </div>`;
    }

    return `<div class="product-card ${isStockZero ? 'disabled-card' : ''}" data-product-id="${product.id}">
        <div class="card-header">
            <div class="product-info-header">
                <div class="product-img">${product.imgIcon}</div>
                <div>
                    <div class="product-title">${highlightText(product.title, currentSearchTerm)}</div>
                    <span class="type-badge ${typeClass}">${escapeHtml(typeLabel)}</span>
                </div>
            </div>
            <button class="mobile-toggle-btn ${!isStockZero ? 'active' : ''}"
                    data-action="toggle" data-id="${product.id}"></button>
        </div>
        <div class="price-info-grid">
            ${priceDisplay}
            <div class="price-info-item"><div class="price-info-label">تغییرات</div><div class="price-info-value">${changeIcon} ${Math.abs(percent)}%</div></div>
            <div class="price-info-item"><div class="price-info-label">وضعیت</div><div class="price-info-value"><span class="stock-badge ${stockClass}">${stockText}</span></div></div>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button class="more-btn" data-action="edit-price" data-id="${product.id}" style="flex:2">
                <i class="fas fa-edit"></i> ویرایش قیمت
            </button>
            <button class="mobile-discount-btn ${hasDiscount ? 'has-discount' : 'no-discount'}"
                    data-action="discount" data-id="${product.id}" style="flex:1">
                <i class="fas fa-tag"></i> ${hasDiscount ? `${product.discount_percent}%` : 'تخفیف'}
            </button>
        </div>
    </div>`;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderTable() {
    const filtered = getFilteredProducts();
    document.getElementById('searchResultsCount').innerHTML = `${filtered.length} محصول`;

    const visible = filtered.slice(0, pageState.size);
    const tbody = document.getElementById('productTableBody');
    const temp = document.createElement('tbody');
    let html = '';
    visible.forEach(p => { html += buildTableRow(p); });

    if (filtered.length > pageState.size) {
        html += `<tr><td colspan="9" style="padding:16px;">
            <button class="load-more-btn" id="loadMoreBtn">
                نمایش ${filtered.length - pageState.size} محصول دیگر
                <i class="fas fa-chevron-down" style="margin-right:6px;"></i>
            </button>
        </td></tr>`;
    }
    temp.innerHTML = html;

    const frag = document.createDocumentFragment();
    while (temp.firstChild) frag.appendChild(temp.firstChild);
    tbody.replaceChildren(frag);

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', () => {
            pageState.size += 50;
            renderTable();
        });
    }

    setTimeout(() => {
        drawSparklinesBatched(visible.map(p => p.id));
    }, 100);
}

function renderMobile() {
    const filtered = getFilteredProducts();
    const visible = filtered.slice(0, pageState.size);
    document.getElementById('searchResultsCount').innerHTML = `${filtered.length} محصول`;

    const container = document.getElementById('mobileCardsContainer');
    const temp = document.createElement('div');
    let html = '';
    visible.forEach(p => { html += buildMobileCard(p); });

    if (filtered.length > pageState.size) {
        html += `<button class="load-more-btn" id="loadMoreMobileBtn" style="margin-top:12px;">
            نمایش ${filtered.length - pageState.size} محصول دیگر
            <i class="fas fa-chevron-down" style="margin-right:6px;"></i>
        </button>`;
    }
    temp.innerHTML = html;

    const frag = document.createDocumentFragment();
    while (temp.firstChild) frag.appendChild(temp.firstChild);
    container.replaceChildren(frag);

    const loadMoreMobileBtn = document.getElementById('loadMoreMobileBtn');
    if (loadMoreMobileBtn) {
        loadMoreMobileBtn.addEventListener('click', () => {
            pageState.size += 50;
            renderMobile();
        });
    }
}

function updateSingleRow(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;

    if (currentView === 'pc') {
        const oldRow = document.querySelector(`tr[data-product-id="${productId}"]`);
        if (!oldRow) return;
        const temp = document.createElement('tbody');
        temp.innerHTML = buildTableRow(product);
        const newRow = temp.firstElementChild;
        oldRow.replaceWith(newRow);
        const canvas = newRow.querySelector('.sparkline-canvas');
        if (canvas && sparklineCache.has(productId)) {
            drawSparklineOnCanvas(canvas, sparklineCache.get(productId));
        } else if (canvas) {
            drawSparklineForCanvas(canvas, productId);
        }
    } else {
        const oldCard = document.querySelector(`.product-card[data-product-id="${productId}"]`);
        if (!oldCard) return;
        const temp = document.createElement('div');
        temp.innerHTML = buildMobileCard(product);
        oldCard.replaceWith(temp.firstElementChild);
    }
}

function renderHistory() {
    const container = document.getElementById('historyList');
    if (!priceHistory.length) {
        container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;font-size:0.8rem;">هیچ تغییری ثبت نشده</div>';
        return;
    }
    container.innerHTML = priceHistory.slice(0, 15).map(h => `
        <div class="history-item">
            <strong>${escapeHtml(h.productTitle)}</strong> :
            ${formatNumber(h.oldPrice)} → ${formatNumber(h.newPrice)}
            <span style="color:${h.percent > 0 ? '#059669' : '#dc2626'};font-weight:700;">
                ${h.percent > 0 ? '🟢' : '🔴'} ${Math.abs(h.percent)}%
            </span>
            <br><small style="color:#94a3b8;">${escapeHtml(h.date)}</small>
        </div>
    `).join('');
}

function renderAll() {
    if (currentView === 'pc') renderTable();
    else renderMobile();

    const activeCount = products.filter(p => p.stock > 0).length;
    document.getElementById('totalProducts').innerText = products.length;
    document.getElementById('activeCount').innerText = activeCount;
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function setupEventDelegation() {
    const tbody = document.getElementById('productTableBody');

    tbody.addEventListener('input', (e) => {
        if (e.target.matches('.price-input')) {
            const raw = parseNumber(e.target.value);
            const cursorPos = e.target.selectionStart;
            e.target.value = formatNumber(raw);
            if (cursorPos <= e.target.value.length) {
                e.target.setSelectionRange(cursorPos, cursorPos);
            }
        }
    });

    const debouncedPriceUpdate = debounce((inp) => {
        const pid = parseInt(inp.dataset.id);
        const raw = parseNumber(inp.value);
        const product = products.find(p => p.id === pid);
        if (raw > 0 && product && raw !== product.currentPrice) {
            updatePriceOnServer(pid, raw);
        }
    }, 700);

    tbody.addEventListener('blur', (e) => {
        if (e.target.matches('.price-input')) {
            debouncedPriceUpdate(e.target);
        }
    }, true);

    tbody.addEventListener('keydown', (e) => {
        if (e.target.matches('.price-input') && e.key === 'Enter') {
            e.preventDefault();
            e.target.blur();
        }
    });

    tbody.addEventListener('change', (e) => {
        if (e.target.matches('.stock-input')) {
            const pid = parseInt(e.target.dataset.id);
            updateStockOnServer(pid, parseNumber(e.target.value));
        }
    });

    tbody.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const pid = parseInt(el.dataset.id);
        const action = el.dataset.action;

        if (action === 'toggle') toggleProductStock(pid);
        else if (action === 'discount') {
            const product = products.find(p => p.id === pid);
            openDiscountModal(product);
        }
    });

    const mobileContainer = document.getElementById('mobileCardsContainer');

    mobileContainer.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const pid = parseInt(el.dataset.id);
        const action = el.dataset.action;

        if (action === 'toggle') toggleProductStock(pid);
        else if (action === 'discount') {
            const product = products.find(p => p.id === pid);
            openDiscountModal(product);
        }
        else if (action === 'edit-price') {
            const product = products.find(p => p.id === pid);
            if (!product) return;
            const newPrice = prompt(`قیمت جدید برای "${product.title}":`, formatNumber(product.currentPrice));
            if (newPrice !== null) {
                const price = parseNumber(newPrice);
                if (price > 0) updatePriceOnServer(pid, price);
                else showMessage('قیمت نامعتبر است', true);
            }
        }
    });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    setupEventDelegation();

    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const debouncedSearch = debounce((val) => {
        currentSearchTerm = val;
        pageState.size = 50;
        loadProducts();
    }, 350);

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value;
        searchClearBtn.style.display = val ? 'block' : 'none';
        debouncedSearch(val);
    });

    searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentSearchTerm = '';
        searchClearBtn.style.display = 'none';
        loadProducts();
    });

    document.getElementById('switchViewBtn').addEventListener('click', () => {
        if (currentView === 'pc') {
            document.getElementById('tableView').style.display = 'none';
            document.getElementById('mobileView').classList.add('active');
            currentView = 'mobile';
            document.getElementById('switchViewBtn').innerHTML = '<i class="fas fa-desktop"></i> نمای کامپیوتر';
        } else {
            document.getElementById('tableView').style.display = 'block';
            document.getElementById('mobileView').classList.remove('active');
            currentView = 'pc';
            document.getElementById('switchViewBtn').innerHTML = '<i class="fas fa-mobile-alt"></i> نمای موبایل';
        }
        renderAll();
    });

    document.getElementById('excelPasteBtn').addEventListener('click', () => {
        const txt = prompt('قیمت‌های جدید را خط به خط وارد کنید (مطابق ترتیب محصولات):');
        if (!txt) return;
        const lines = txt.split(/\r?\n/).filter(l => l.trim());
        const filtered = getFilteredProducts();
        for (let i = 0; i < Math.min(lines.length, filtered.length); i++) {
            const price = parseNumber(lines[i]);
            if (price) updatePriceOnServer(filtered[i].id, price);
        }
        showMessage('در حال بروزرسانی قیمت‌ها...');
    });

    document.getElementById('closeDiscountModalBtn').addEventListener('click', closeDiscountModal);
    document.getElementById('discountModalCancelBtn').addEventListener('click', closeDiscountModal);
    document.getElementById('discountModalSaveBtn').addEventListener('click', saveProductDiscount);
    document.getElementById('discountPercentInput').addEventListener('input', updateDiscountPreview);

    document.querySelectorAll('.quick-discount-preset').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById('discountPercentInput').value = btn.dataset.discount;
            updateDiscountPreview();
        });
    });

    document.getElementById('discountModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('discountModal')) closeDiscountModal();
    });

    loadCategories();
    loadProducts();
});
</script>
