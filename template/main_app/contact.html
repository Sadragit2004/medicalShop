{% extends "main_template.html" %}

{% block content %}



<saya-contact-page>
<template shadowrootmode="open">
<style>
    :host {
        all: initial;
        display: block;
        width: 100%;
        direction: rtl;
        font-family: var(--saya-font, "Vazirmatn", "IRANSansX", "IRANSans", "Vazir", "Segoe UI", Tahoma, system-ui, sans-serif);
        color: #1d2a33;
        line-height: 1.8;
        -webkit-text-size-adjust: 100%;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Stage: soft aurora behind the glass ---------- */

    .stage {
        --accent: #1fa6b6;
        --accent-deep: #17808d;
        --ink: #1d2a33;
        --muted: #6b7983;
        --wa: #1a9b6c;

        position: relative;
        overflow: hidden;
        isolation: isolate;
        padding: 40px 20px 36px;
        background: linear-gradient(165deg, #ecf8fa 0%, #f5f9fb 45%, #e8f3f6 100%);
    }

    .blob {
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
    }
    .blob-a { top: -120px; right: -90px; width: 420px; height: 420px; background: rgba(31, 166, 182, 0.38); }
    .blob-b { top: 38%;   left: -140px; width: 380px; height: 380px; background: rgba(120, 190, 235, 0.32); }
    .blob-c { bottom: -140px; right: 18%; width: 360px; height: 360px; background: rgba(80, 210, 175, 0.26); }

    .shell {
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* ---------- Glass ---------- */

    .glass {
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 26px;
        box-shadow:
            0 12px 34px rgba(30, 70, 90, 0.08),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);
        -webkit-backdrop-filter: blur(24px) saturate(165%);
        backdrop-filter: blur(24px) saturate(165%);
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .glass { background: rgba(255, 255, 255, 0.9); }
    }

    /* ---------- Hero ---------- */

    .hero {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 26px 28px;
    }

    .logo {
        flex: 0 0 60px;
        width: 60px;
        height: 60px;
        padding: 15px;
        color: var(--accent);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        box-shadow: 0 6px 18px rgba(31, 166, 182, 0.16);
    }
    .logo svg { stroke-width: 2; }

    .hero-text { min-width: 0; flex: 1; }

    h1 {
        font-size: clamp(22px, 3vw, 28px);
        line-height: 1.5;
        font-weight: 800;
        letter-spacing: -0.4px;
    }

    .hero-text p {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.9;
    }

    .status {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 13px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }
    .status i {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #b8c2c9;
    }
    .status[data-state="open"] { color: #137a56; }
    .status[data-state="open"] i { background: var(--wa); box-shadow: 0 0 0 4px rgba(26, 155, 108, 0.14); }
    .status[data-state="closed"] i { background: #d29a93; }

    /* ---------- People ---------- */

    .people {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    .person { padding: 22px; min-width: 0; }

    .person-head {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 18px;
    }

    .avatar {
        flex: 0 0 46px;
        width: 46px;
        height: 46px;
        padding: 11px;
        color: var(--accent-deep);
        background: linear-gradient(145deg, rgba(31, 166, 182, 0.2), rgba(31, 166, 182, 0.07));
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
    }

    .person-head h2 { font-size: 16.5px; font-weight: 800; line-height: 1.5; }
    .person-head p  { color: var(--muted); font-size: 12px; }

    .rows { display: flex; flex-direction: column; gap: 8px; }

    .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        transition: background 0.2s ease, transform 0.2s ease;
    }
    .row:hover { background: rgba(255, 255, 255, 0.85); }
    .row:active { transform: scale(0.985); }

    .row-icon {
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        padding: 9px;
        color: var(--accent-deep);
        background: rgba(255, 255, 255, 0.85);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(30, 70, 90, 0.07);
    }
    .row.wa .row-icon { color: var(--wa); }

    .row-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
        flex: 1;
    }
    .row-label { color: var(--muted); font-size: 11.5px; line-height: 1.6; }
    .row-value {
        direction: ltr;
        unicode-bidi: isolate;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.2px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .row.wa .row-value {
        direction: rtl;
        color: #137a56;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0;
    }

    .chev { flex: 0 0 16px; width: 16px; height: 16px; color: #a7b3ba; }

    /* ---------- Visit ---------- */

    .visit {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 0;
        padding: 0;
        overflow: hidden;
    }

    .visit-col { padding: 24px 26px; min-width: 0; }
    .visit-col + .visit-col { border-right: 1px solid rgba(255, 255, 255, 0.85); }

    .col-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
        font-size: 15px;
        font-weight: 800;
    }
    .col-title svg { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }

    .city { color: var(--muted); font-size: 12.5px; font-weight: 600; }

    address {
        font-style: normal;
        font-size: 15px;
        font-weight: 600;
        line-height: 2.1;
        color: #33424c;
    }
    address strong { color: var(--ink); font-weight: 800; }

    .map-btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 16px;
        padding: 9px 15px 9px 13px;
        color: var(--accent-deep);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        transition: background 0.2s ease;
    }
    .map-btn:hover { background: #fff; }
    .map-btn svg { width: 17px; height: 17px; }

    .hours { display: flex; flex-direction: column; gap: 8px; }
    .hour {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 14px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 14px;
        font-size: 13px;
    }
    .hour span:first-child { color: #47545e; font-weight: 700; }
    .hour span:last-child {
        direction: ltr;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .hour.today { background: rgba(255, 255, 255, 0.95); box-shadow: 0 0 0 1.5px rgba(31, 166, 182, 0.45); }

    .off {
        margin-top: 12px;
        color: #8b6a66;
        font-size: 12px;
        line-height: 1.9;
    }

    /* ---------- CTA ---------- */

    .cta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 22px 26px;
    }
    .cta h2 { font-size: 17px; font-weight: 800; line-height: 1.6; }
    .cta p  { color: var(--muted); font-size: 13px; }

    .shop {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        padding: 12px 22px;
        color: #fff;
        background: linear-gradient(145deg, #2a3b46, #1d2a33);
        border-radius: 16px;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 10px 22px rgba(29, 42, 51, 0.22);
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .shop:hover { background: linear-gradient(145deg, var(--accent-deep), #126671); transform: translateY(-2px); }
    .shop svg { width: 18px; height: 18px; }

    footer {
        padding-top: 6px;
        text-align: center;
        color: #8a959d;
        font-size: 11.5px;
    }

    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ---------- Entrance: one gentle reveal ---------- */

    .shell { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* ---------- Responsive ---------- */

    @media (max-width: 760px) {
        .stage { padding: 20px 14px 28px; }
        .people { grid-template-columns: 1fr; gap: 14px; }
        .visit { grid-template-columns: 1fr; }
        .visit-col + .visit-col { border-right: 0; border-top: 1px solid rgba(255, 255, 255, 0.85); }
    }

    @media (max-width: 560px) {
        .glass { border-radius: 22px; }
        .hero { flex-wrap: wrap; gap: 14px; padding: 20px; }
        .logo { flex-basis: 52px; width: 52px; height: 52px; padding: 13px; border-radius: 17px; }
        .hero-text { flex-basis: calc(100% - 70px); }
        .hero-text p { font-size: 12.5px; }
        .person { padding: 18px; }
        .visit-col { padding: 20px; }
        .cta { flex-direction: column; align-items: stretch; padding: 20px; gap: 16px; }
        .shop { width: 100%; }
    }

    @media (max-width: 360px) {
        .row-value { font-size: 13.5px; }
        .row { gap: 9px; padding: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
</style>

<script>
(function () {
    var host = document.querySelector('saya-contact-page');
    if (!host) return;

    /* Fallback for browsers without declarative shadow DOM */
    if (!host.shadowRoot) {
        var tpl = host.querySelector('template[shadowrootmode]');
        if (tpl) {
            host.attachShadow({ mode: 'open' }).appendChild(tpl.content);
            tpl.remove();
        }
    }

    var root = host.shadowRoot;
    if (!root) return;

    /* Live open / closed status, Tabriz time (Asia/Tehran) */
    try {
        var parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Tehran', weekday: 'short',
            hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(new Date());

        var get = function (t) {
            for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value;
        };
        var day = get('weekday');
        var mins = (parseInt(get('hour'), 10) % 24) * 60 + parseInt(get('minute'), 10);

        var start = 9 * 60 + 30;
        var end = null;
        var todayId = null;

        if (day === 'Sat' || day === 'Sun' || day === 'Mon' || day === 'Tue' || day === 'Wed') { end = 19 * 60; todayId = 'h-main'; }
        else if (day === 'Thu') { end = 16 * 60; todayId = 'h-thu'; }

        var isOpen = end !== null && mins >= start && mins < end;
        var status = root.getElementById('status');
        var text = root.getElementById('status-text');

        status.setAttribute('data-state', isOpen ? 'open' : 'closed');
        text.textContent = isOpen ? 'اکنون در ساعت کاری هستیم' : 'اکنون خارج از ساعت کاری هستیم';

        if (todayId) root.getElementById(todayId).classList.add('today');
    } catch (e) { /* keep default text */ }
})();
</script>
